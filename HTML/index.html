<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <title>ShopEase Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar bg-white shadow-sm sticky-top py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-primary fs-3" href="index.html">ShopEase</a>
            <input class="form-control w-50" id="searchBar" placeholder="Search for products..."
                onkeyup="filterProducts()">
            <div class="d-flex gap-3"><i class="bi bi-heart fs-4"></i><i class="bi bi-cart fs-4"></i></div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row px-3">
            <aside class="col-md-3 col-lg-2">
                <div class="filter-title">Categories</div>
                <ul class="list-unstyled filter-list mb-4">
                    <li class="category-btn active" onclick="filterCategory('All', this)">All Products</li>
                    <li class="category-btn" onclick="filterCategory('Laptops', this)">Laptops</li>
                    <li class="category-btn" onclick="filterCategory('Phones', this)">Phones</li>
                    <li class="category-btn" onclick="filterCategory('Accessories', this)">Accessories</li>
                </ul>

                <div class="filter-title">Price Range</div>
                <div class="filter-list">
                    <div class="form-check mb-2 small"><input class="form-check-input" type="radio" name="pr" id="r0"
                            value="all" checked onclick="filterProducts()"><label class="form-check-label" for="r0">All
                            Prices</label></div>
                    <div class="form-check mb-2 small"><input class="form-check-input" type="radio" name="pr" id="r1"
                            value="0-100" onclick="filterProducts()"><label class="form-check-label" for="r1">Under
                            $100</label></div>
                    <div class="form-check mb-2 small"><input class="form-check-input" type="radio" name="pr" id="r2"
                            value="100-500" onclick="filterProducts()"><label class="form-check-label" for="r2">$100 -
                            $500</label></div>
                    <div class="form-check mb-2 small"><input class="form-check-input" type="radio" name="pr" id="r3"
                            value="500-1000" onclick="filterProducts()"><label class="form-check-label" for="r3">$500 -
                            $1000</label></div>
                    <div class="form-check mb-2 small"><input class="form-check-input" type="radio" name="pr" id="r4"
                            value="1000+" onclick="filterProducts()"><label class="form-check-label" for="r4">Over
                            $1000</label></div>
                </div>
            </aside>

            <main class="col-md-9 col-lg-10">
                <div class="row g-4" id="productGrid"></div>
                <nav class="mt-5 pb-5">
                    <ul class="pagination justify-content-center" id="paginationControls"></ul>
                </nav>
            </main>
        </div>
    </div>

    <footer class="main-footer">
        <div class="container text-start">
            <div class="row">
                <div class="col-md-4 mb-4">
                    <h5 class="fw-bold text-primary">ShopEase</h5>
                    <p class="text-muted small">The best destination for high-quality electronics and accessories.</p>
                </div>
                <div class="col-md-4 mb-4 footer-links">
                    <h6 class="fw-bold">Quick Links</h6>
                    <ul class="list-unstyled">
                        <li><a href="#">Home</a></li>
                        <li><a href="#">About Us</a></li>
                    </ul>
                </div>
                <div class="col-md-4 mb-4">
                    <h6 class="fw-bold">Follow Us</h6>
                    <div class="d-flex gap-3 fs-5 mt-3"><i class="bi bi-facebook"></i><i class="bi bi-instagram"></i><i
                            class="bi bi-twitter"></i></div>
                </div>
            </div>
            <div class="text-center pt-4 border-top small text-muted">© 2024 ShopEase Store. All rights reserved.</div>
        </div>
    </footer>

    <script>
        const products = [];
        const imgs = {
            "Laptops": "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500",
            "Phones": "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500",
            "Accessories": "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
        };

        for (let i = 1; i <= 100; i++) {
            let catArr = ["Laptops", "Phones", "Accessories"];
            let cat = catArr[i % 3];
            let rating = (Math.random() * (5 - 3.5) + 3.5).toFixed(1); // تقييم عشوائي بين 3.5 و 5.0
            products.push({
                id: i, name: `${cat} Premium ${i}`, category: cat,
                price: Math.floor(Math.random() * 1400) + 30, img: imgs[cat] + "&sig=" + i,
                ratingValue: rating
            });
        }

        let filtered = [...products];
        let currentPage = 1, perPage = 12;

        function display() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";
            const items = filtered.slice((currentPage - 1) * perPage, currentPage * perPage);
            items.forEach(p => {
                grid.innerHTML += `
                    <div class="col-sm-6 col-md-4 col-lg-3">
                        <div class="card product-card shadow-sm h-100">
                            <div class="wishlist-icon" onclick="this.classList.toggle('active'); this.querySelector('i').classList.toggle('bi-heart'); this.querySelector('i').classList.toggle('bi-heart-fill');"><i class="bi bi-heart"></i></div>
                            <img src="${p.img}" class="card-img-top">
                            <div class="card-body p-3 text-center">
                                <h6 class="fw-bold text-truncate">${p.name}</h6>
                                <p class="mb-1 small">
                                    <span class="rating-num">${p.ratingValue}</span>
                                    <span class="text-warning">★★★★☆</span>
                                </p>
                                <p class="price mb-3">$${p.price}</p>
                                <a href="product.html?name=${encodeURIComponent(p.name)}&price=${p.price}&img=${encodeURIComponent(p.img)}&rating=${p.ratingValue}" class="btn btn-outline-primary btn-sm w-100 rounded-pill">View Details</a>
                            </div>
                        </div>
                    </div>`;
            });
            renderPagination();
        }

        function renderPagination() {
            const controls = document.getElementById('paginationControls');
            controls.innerHTML = "";
            const total = Math.ceil(filtered.length / perPage);
            for (let i = 1; i <= total; i++) {
                controls.innerHTML += `<li class="page-item ${i === currentPage ? 'active' : ''}"><button class="page-link shadow-none" onclick="currentPage=${i}; display(); window.scrollTo(0,0)">${i}</button></li>`;
            }
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            window.activeCat = cat;
            filterProducts();
        }

        function filterProducts() {
            const search = document.getElementById('searchBar').value.toLowerCase();
            const cat = window.activeCat || 'All';
            const priceVal = document.querySelector('input[name="pr"]:checked').value;
            filtered = products.filter(p => {
                const mSearch = p.name.toLowerCase().includes(search);
                const mCat = (cat === 'All' || p.category === cat);
                let mPrice = true;
                if (priceVal === '0-100') mPrice = p.price < 100;
                else if (priceVal === '100-500') mPrice = p.price >= 100 && p.price <= 500;
                else if (priceVal === '500-1000') mPrice = p.price > 500 && p.price <= 1000;
                else if (priceVal === '1000+') mPrice = p.price > 1000;
                return mSearch && mCat && mPrice;
            });
            currentPage = 1; display();
        }
        display();
    </script>
</body>

</html>
