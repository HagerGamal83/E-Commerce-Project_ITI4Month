<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <title>ShopEase Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .category-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .collapse-icon {
            transition: transform 0.3s;
        }

        /* تعديل لضمان دوران السهم بشكل صحيح عند الفتح والغلق */
        .category-header.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }
    </style>
</head>

<body>

    <nav class="navbar bg-white shadow-sm sticky-top py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-primary fs-3" href="index.html">ShopEase</a>
            <input class="form-control w-50" id="searchBar" placeholder="Search for products..."
                onkeyup="filterProducts()">
            <div class="d-flex gap-3"><i class="bi bi-heart fs-4"></i><i class="bi bi-cart fs-4"></i></div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row px-3">
            <aside class="col-md-3 col-lg-2">

                <div class="filter-title category-header collapsed" data-bs-toggle="collapse"
                    data-bs-target="#catCollapse">
                    Categories
                    <i class="bi bi-chevron-down collapse-icon"></i>
                </div>

                <div class="collapse" id="catCollapse">
                    <div class="filter-section mb-3 p-2 bg-white rounded border">
                        <div class="form-check mb-2 small">
                            <input class="form-check-input cat-check" type="checkbox" id="catAll" value="All" checked
                                onclick="toggleAll(this)">
                            <label class="form-check-label" for="catAll">All Products</label>
                        </div>
                        <div class="form-check mb-2 small">
                            <input class="form-check-input cat-check" type="checkbox" name="cat" value="Laptops"
                                onclick="updateFilters()">
                            <label class="form-check-label" for="catLaptops">Laptops</label>
                        </div>
                        <div class="form-check mb-2 small">
                            <input class="form-check-input cat-check" type="checkbox" name="cat" value="Phones"
                                onclick="updateFilters()">
                            <label class="form-check-label" for="catPhones">Phones</label>
                        </div>
                        <div class="form-check mb-2 small">
                            <input class="form-check-input cat-check" type="checkbox" name="cat" value="Tablets"
                                onclick="updateFilters()">
                            <label class="form-check-label" for="catTablets">Tablets</label>
                        </div>
                        <div class="form-check mb-2 small">
                            <input class="form-check-input cat-check" type="checkbox" name="cat" value="Watches"
                                onclick="updateFilters()">
                            <label class="form-check-label" for="catWatches">Watches</label>
                        </div>
                        <div class="form-check mb-2 small">
                            <input class="form-check-input cat-check" type="checkbox" name="cat" value="Accessories"
                                onclick="updateFilters()">
                            <label class="form-check-label" for="catAccessories">Accessories</label>
                        </div>

                        <button class="btn btn-link btn-sm text-danger p-0 mt-2 shadow-none" onclick="clearFilters()"
                            style="text-decoration: none; font-size: 0.8rem;">
                            <i class="bi bi-x-circle me-1"></i>Clear Filters
                        </button>
                    </div>
                </div>

                <div class="filter-title">Price Range</div>
                <div class="px-2 mb-4">
                    <input type="range" class="form-range" id="priceSlider" min="0" max="1500" step="50" value="1500"
                        oninput="updatePriceLabel(this.value)">
                    <div class="d-flex justify-content-between small text-muted mt-2">
                        <span>$0</span>
                        <span class="fw-bold text-primary">Up to: $<span id="maxPriceLabel">1500</span></span>
                    </div>
                </div>
            </aside>

            <main class="col-md-9 col-lg-10">
                <div class="row g-4" id="productGrid"></div>
                <nav class="mt-5 pb-5">
                    <ul class="pagination justify-content-center" id="paginationControls"></ul>
                </nav>
            </main>
        </div>
    </div>

    <footer class="main-footer">
        <div class="container text-start">
            <div class="row">
                <div class="col-md-4 mb-4">
                    <h5 class="fw-bold text-primary">ShopEase</h5>
                    <p class="text-muted small">The best destination for high-quality electronics.</p>
                </div>
                <div class="col-md-4 mb-4 footer-links">
                    <h6 class="fw-bold">Quick Links</h6>
                    <ul class="list-unstyled">
                        <li><a href="#">Home</a></li>
                        <li><a href="#">About Us</a></li>
                    </ul>
                </div>
                <div class="col-md-4 mb-4">
                    <h6 class="fw-bold">Follow Us</h6>
                    <div class="d-flex gap-3 fs-5 mt-3"><i class="bi bi-facebook"></i><i class="bi bi-instagram"></i>
                    </div>
                </div>
            </div>
            <div class="text-center pt-4 border-top small text-muted">© 2024 ShopEase Store. All rights reserved.</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const products = [];
        const imgs = {
            "Laptops": "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500",
            "Phones": "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500",
            "Tablets": "https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=500",
            "Watches": "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500",
            "Accessories": "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
        };

        const catList = ["Laptops", "Phones", "Tablets", "Watches", "Accessories"];

        for (let i = 1; i <= 100; i++) {
            let cat = catList[i % catList.length];
            products.push({
                id: i, name: `${cat} Premium ${i}`, category: cat,
                price: Math.floor(Math.random() * 1400) + 30, img: imgs[cat] + "&sig=" + i,
                ratingValue: (Math.random() * (5 - 3.5) + 3.5).toFixed(1)
            });
        }

        let filtered = [...products];
        let currentPage = 1, perPage = 12;

        function display() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";
            const items = filtered.slice((currentPage - 1) * perPage, currentPage * perPage);
            items.forEach(p => {
                grid.innerHTML += `
                    <div class="col-sm-6 col-md-4 col-lg-3">
                        <div class="card product-card shadow-sm h-100">
                            <div class="wishlist-icon" onclick="this.classList.toggle('active');"><i class="bi bi-heart"></i></div>
                            <img src="${p.img}" class="card-img-top">
                            <div class="card-body p-3 text-center">
                                <h6 class="fw-bold text-truncate">${p.name}</h6>
                                <p class="mb-1 small"><span class="rating-num">${p.ratingValue}</span> <span class="text-warning">★★★★☆</span></p>
                                <p class="price mb-3">$${p.price}</p>
                                <a href="product.html?name=${encodeURIComponent(p.name)}&price=${p.price}&img=${encodeURIComponent(p.img)}&rating=${p.ratingValue}" class="btn btn-outline-primary btn-sm w-100 rounded-pill">View Details</a>
                            </div>
                        </div>
                    </div>`;
            });
            renderPagination();
        }

        function renderPagination() {
            const controls = document.getElementById('paginationControls');
            controls.innerHTML = "";
            const total = Math.ceil(filtered.length / perPage);
            for (let i = 1; i <= total; i++) {
                controls.innerHTML += `<li class="page-item ${i === currentPage ? 'active' : ''}"><button class="page-link shadow-none" onclick="currentPage=${i}; display(); window.scrollTo(0,0)">${i}</button></li>`;
            }
        }

        function updatePriceLabel(val) {
            document.getElementById('maxPriceLabel').innerText = val;
            filterProducts();
        }

        function toggleAll(el) {
            const checkboxes = document.querySelectorAll('input[name="cat"]');
            if (el.checked) {
                checkboxes.forEach(cb => cb.checked = false);
            }
            filterProducts();
        }

        function updateFilters() {
            const checkboxes = document.querySelectorAll('input[name="cat"]:checked');
            const allCheck = document.getElementById('catAll');

            if (checkboxes.length > 0) {
                allCheck.checked = false;
            } else {
                allCheck.checked = true;
            }
            filterProducts();
        }

        function clearFilters() {
            document.getElementById('catAll').checked = true;
            document.querySelectorAll('input[name="cat"]').forEach(cb => cb.checked = false);
            document.getElementById('priceSlider').value = 1500;
            document.getElementById('maxPriceLabel').innerText = 1500;
            document.getElementById('searchBar').value = '';
            filterProducts();
        }

        function filterProducts() {
            const search = document.getElementById('searchBar').value.toLowerCase();
            const maxPrice = parseInt(document.getElementById('priceSlider').value);

            const selectedCats = Array.from(document.querySelectorAll('input[name="cat"]:checked')).map(cb => cb.value);
            const isAll = document.getElementById('catAll').checked;

            filtered = products.filter(p => {
                const mSearch = p.name.toLowerCase().includes(search);
                const mCat = isAll || selectedCats.includes(p.category);
                const mPrice = p.price <= maxPrice;
                return mSearch && mCat && mPrice;
            });
            currentPage = 1;
            display();
        }

        display();
    </script>
</body>

</html>
