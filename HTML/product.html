<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <title>Product Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-white">
    <nav class="navbar border-bottom py-3">
        <div class="container"><a href="index.html" class="navbar-brand fw-bold text-primary">ShopEase</a><a
                href="index.html" class="btn btn-light rounded-pill px-4 border">Back to Store</a></div>
    </nav>
    <div class="container mt-5">
        <div class="row g-5 align-items-center">
            <div class="col-md-6 text-center"><img id="p-img" src="" class="img-fluid rounded-4 shadow-sm"
                    style="max-height: 450px; width: 100%; object-fit: cover;"></div>
            <div class="col-md-6 text-start">
                <h1 id="p-title" class="fw-bold mb-3"></h1>
                <p class="h5 mb-3">
                    <span id="p-rating-val" class="fw-bold me-2"></span>
                    <span class="text-warning">★★★★☆</span>
                    <span class="text-muted fs-6 ms-2">(150 reviews)</span>
                </p>
                <h3 id="p-price" class="text-primary fw-bold mb-4"></h3>
                <p class="text-muted lh-lg mb-5">This product represents the latest in technology, combining elegant
                    design with powerful performance to meet your expectations.</p>
                <div class="d-flex gap-3">
                    <button class="btn btn-primary btn-lg flex-grow-1 rounded-pill">Add to Cart</button>
                    <button class="btn btn-outline-danger rounded-pill px-4"
                        onclick="this.classList.toggle('active'); this.querySelector('i').classList.toggle('bi-heart'); this.querySelector('i').classList.toggle('bi-heart-fill');"><i
                            class="bi bi-heart"></i></button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('p-title').innerText = params.get('name') || "Product Name";
        document.getElementById('p-price').innerText = "$" + (params.get('price') || "0.00");
        document.getElementById('p-img').src = decodeURIComponent(params.get('img') || "download.jpg");
        document.getElementById('p-rating-val').innerText = params.get('rating') || "4.5";
    </script>
</body>

</html>
